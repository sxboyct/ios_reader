name: YingxiaReader
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
packages:
  ReaderCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  YingxiaReader:
    type: application
    platform: iOS
    sources:
      - App
      - path: Config/iOS/Assets.xcassets
    dependencies:
      - package: ReaderCore
        product: TVCore
    info:
      path: Config/iOS/Info.plist
      properties:
        CFBundleDisplayName: 映匣阅读
        CFBundleShortVersionString: '1.0.0'
        CFBundleVersion: '1'
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tvbox.yingxia.reader
        PRODUCT_NAME: YingxiaReader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  ReaderCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests/ReaderCoreTests
    dependencies:
      - package: ReaderCore
        product: TVCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tvbox.yingxia.reader.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  YingxiaReader:
    build:
      targets:
        YingxiaReader: all
    test:
      targets: [ReaderCoreTests]
